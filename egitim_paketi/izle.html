<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Eğitim İzleme</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:16px/1.4 system-ui,Arial,sans-serif;background:#0F172A;color:#fff;display:flex;flex-direction:column}
.u{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#0F172A;flex-wrap:wrap}.u b{flex:1;min-width:140px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:14px}
button,select{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 14px;background:#E5E7EB;color:#111;cursor:pointer}button.p{background:#1D4ED8;color:#fff}button:disabled{opacity:.4}
#sh{flex:1;position:relative;overflow:hidden;background:#0F172A;min-height:0}#fr{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;background:#fff;transform-origin:0 0}.l{max-width:560px;margin:20px auto;padding:0 14px;width:100%}.l h1{font-size:20px}.l a{display:block;background:#fff;color:#111;border-radius:12px;padding:12px 14px;margin:8px 0;text-decoration:none;font-weight:600}.l a small{display:block;color:#64748B;font-weight:400}
.h{padding:20px;text-align:center}
#ft{display:flex;align-items:center;gap:8px;padding:5px 10px;background:#0B1220;color:#CBD5E1;font-size:12px;line-height:1.25}
#ft img{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none;background:#1E293B}
#ft .t{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}#ft .t b{color:#fff}
#ft a{flex:none;color:#fff;text-decoration:none;font-weight:700;border-radius:8px;padding:6px 9px;font-size:12px}
#ft a.w{background:#16A34A}#ft a.o{background:#B45309}
@media (max-width:520px){#ft .t span{display:none}}
@media (max-height:420px){#ft{padding:3px 8px}#ft img{width:24px;height:24px}}
</style></head><body>
<div id="k"><p class="h">Yükleniyor…</p></div>
<script>
(function(){
var Q=new URLSearchParams(location.search),V=(Q.get("v")||"v3").replace(/[^a-z0-9]/gi,""),KOD=Q.get("k")||"",SESLI=Q.get("s")!=="0";
var TABAN=location.href.replace(/[?#].*$/,"").replace(/\/[^\/]*$/,"");
var K=document.getElementById("k"),S=null,au=null,ses=SESLI;
function e(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function js(u){return fetch(u,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}
function hata(m){K.innerHTML='<p class="h">'+e(m)+'</p>'}
js(TABAN+"/"+V+"/paket.json").then(function(P){
  var surum=P.surum||V,sl=P.slaytSurum||surum;
  if(!KOD){
    K.className="l";K.innerHTML='<h1>Eğitim izleme</h1><p style="color:#CBD5E1;font-size:14px">İzlemek istediğiniz konuyu seçin.</p>'+P.konular.map(function(k){return'<a href="?v='+encodeURIComponent(V)+'&k='+encodeURIComponent(k.kod)+'">'+e(k.kod)+' · '+e(k.ad)+'</a>'}).join("");return;
  }
  var kn=P.konular.filter(function(x){return x.kod===KOD})[0];if(!kn)return hata("Konu bulunamadı: "+KOD);
  return js(TABAN+"/"+V+"/"+encodeURIComponent(kn.klasor)+"/manifest.json").then(function(M){
    var L=(M.slaytlar||[]).filter(function(x){return x.tip!=="mq"});if(!L.length)return hata("Bu konuda gösterilecek slayt yok.");
    S={kn:kn,L:L,i:0,onb:{},sesj:null,surum:surum,sl:sl};
    var sj=ses?js(TABAN+"/"+V+"/"+encodeURIComponent(kn.klasor)+"/ses.json").catch(function(){return null}):Promise.resolve(null);
    return sj.then(function(j){S.sesj=j;if(!j)ses=false;cizIskele();git(0)});
  });
}).catch(function(x){hata("Eğitim yüklenemedi: "+x.message)});
function cizIskele(){
  document.title=S.kn.kod+" · "+S.kn.ad;
  K.style.display="contents";
  K.innerHTML='<div class="u"><b>'+e(S.kn.kod)+' · '+e(S.kn.ad)+'</b><a href="?v='+encodeURIComponent(V)+'" style="background:#E5E7EB;color:#111;border-radius:10px;padding:9px 14px;font-weight:700;text-decoration:none">☰ Konular</a>'+(S.sesj?'<button id="bs"></button>':'')+'<button id="bg">◀</button><span id="bn"></span><button id="bi" class="p">▶</button><button id="bt">⛶</button></div><div id="sh"><iframe id="fr" title="Slayt"></iframe></div><div id="ft"><img src="altan.jpg" alt="" onerror="this.style.display=\'none\'"><div class="t"><b>Hazırlayan: Altan Şahin</b><span> · İş Güvenliği Uzmanı · Bilginer Danışmanlık OSGB</span></div><a class="w" id="fw" target="_blank" rel="noopener">💬 WhatsApp</a><a class="o" id="fo" target="_blank" rel="noopener">📝 Öneri / talep</a></div>';
  wal();
  olc();window.addEventListener("resize",olc);window.addEventListener("orientationchange",function(){setTimeout(olc,200)});document.addEventListener("fullscreenchange",function(){setTimeout(olc,150)});
  document.getElementById("bg").onclick=function(){git(S.i-1)};document.getElementById("bi").onclick=function(){git(S.i+1)};
  document.getElementById("bt").onclick=function(){var d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen()};
  var b=document.getElementById("bs");if(b)b.onclick=function(){ses=!ses;if(ses)cal();else if(au)au.pause();dugme()};
  document.addEventListener("keydown",function(ev){if(ev.key==="ArrowRight"||ev.key==="PageDown"){git(S.i+1);ev.preventDefault()}else if(ev.key==="ArrowLeft"||ev.key==="PageUp"){git(S.i-1);ev.preventDefault()}});
}
var WA="905367205779";
function wal(){var w=document.getElementById("fw"),o=document.getElementById("fo");if(!w||!o)return;var k=S?S.kn.kod+" · "+S.kn.ad+", slayt "+(S.i+1)+"/"+S.L.length:"";
 w.href="https://wa.me/"+WA+"?text="+encodeURIComponent("Merhaba, eğitim izleme sayfasından yazıyorum.");
 o.href="https://wa.me/"+WA+"?text="+encodeURIComponent("Eğitim izleme – ÖNERİ / TALEP\nKonu: "+k+"\nMesajım: ")}
function olc(){var s=document.getElementById("sh"),f=document.getElementById("fr");if(!s||!f)return;var w=s.clientWidth,hh=s.clientHeight,sc=Math.min(w/1920,hh/1080);f.style.transform="scale("+sc+")";f.style.left=Math.max(0,(w-1920*sc)/2)+"px";f.style.top=Math.max(0,(hh-1080*sc)/2)+"px"}
function dugme(){var b=document.getElementById("bs");if(b)b.textContent=ses?"🔊":"🔇"}
function cal(){
  if(au)try{au.pause()}catch(x){}
  if(!ses||!S.sesj)return;var sl=S.L[S.i],c=S.sesj.slaytlar&&S.sesj.slaytlar[sl.id];if(!c||!(c.e>c.b))return;
  var u=TABAN+"/"+V+"/"+encodeURIComponent(S.kn.klasor)+"/"+(S.sesj.dosya||"ses.mp3");
  if(!au)au=new Audio();
  var basla=function(){try{au.currentTime=c.b}catch(x){}au.ontimeupdate=function(){if(au.currentTime>=c.e){au.pause();au.ontimeupdate=null}};var p=au.play();if(p&&p.catch)p.catch(function(){})};
  if(au.getAttribute("data-u")!==u){au.setAttribute("data-u",u);au.src=u;au.addEventListener("loadedmetadata",function o(){au.removeEventListener("loadedmetadata",o);basla()});au.load()}else basla();
}
function git(n){
  if(!S||n<0||n>=S.L.length)return;S.i=n;var sl=S.L[n],idx=n;
  wal();olc();document.getElementById("bn").textContent=(n+1)+" / "+S.L.length;document.getElementById("bg").disabled=n===0;document.getElementById("bi").disabled=n===S.L.length-1;dugme();cal();
  var u=TABAN+"/"+encodeURIComponent(S.sl)+"/"+encodeURIComponent(S.kn.klasor)+"/"+encodeURIComponent(sl.id)+".html",fr=document.getElementById("fr");
  (S.onb[u]?Promise.resolve(S.onb[u]):fetch(u).then(function(r){if(!r.ok)throw new Error("http "+r.status);return r.text()}).then(function(h){S.onb[u]=h;return h})).then(function(h){
    if(S.i!==idx)return;
    h=h.replace(/\{([A-ZÇĞİÖŞÜ_]+)\}/g,"—").replace(/<head>/i,"<head><style>:root{--w:0.35s}</style>");fr.srcdoc=h;
  }).catch(function(x){fr.srcdoc="<p style='font:16px sans-serif;padding:20px'>Slayt yüklenemedi: "+e(x.message)+"</p>"});
}
})();
</script></body></html>
